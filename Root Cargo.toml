[workspace]
resolver = "2"

members = [
    "crates/herald-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["ledante"]
repository = "https://github.com/shitaginashi/herald"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"